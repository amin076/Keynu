name: NPM dependency security audit

on:
  push:
    branches:
      - main
      - "audit/**"
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-security-audit.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-security-audit.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate lockfile install
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          echo "all_exit_code=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          echo "production_exit_code=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Summarize and enforce policy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function readReport(path) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (report.error) {
              throw new Error(`${path}: npm audit error: ${JSON.stringify(report.error)}`);
            }
            return report;
          }

          function counts(report) {
            const value = report.metadata?.vulnerabilities ?? {};
            return {
              info: Number(value.info ?? 0),
              low: Number(value.low ?? 0),
              moderate: Number(value.moderate ?? 0),
              high: Number(value.high ?? 0),
              critical: Number(value.critical ?? 0),
              total: Number(value.total ?? 0),
            };
          }

          const allCounts = counts(readReport('npm-audit-all.json'));
          const productionCounts = counts(readReport('npm-audit-production.json'));
          const summary = {
            policy: 'fail on high or critical vulnerabilities in any dependency scope; report lower severities',
            all: allCounts,
            production: productionCounts,
          };
          fs.writeFileSync('npm-audit-summary.json', JSON.stringify(summary, null, 2) + '\n');

          const markdown = [
            '# npm dependency security audit',
            '',
            '| Scope | Info | Low | Moderate | High | Critical | Total |',
            '| --- | ---: | ---: | ---: | ---: | ---: | ---: |',
            `| All dependencies | ${allCounts.info} | ${allCounts.low} | ${allCounts.moderate} | ${allCounts.high} | ${allCounts.critical} | ${allCounts.total} |`,
            `| Production only | ${productionCounts.info} | ${productionCounts.low} | ${productionCounts.moderate} | ${productionCounts.high} | ${productionCounts.critical} | ${productionCounts.total} |`,
            '',
            `Raw npm audit exit codes: all=${process.env.all_exit_code ?? 'unknown'}, production=${process.env.production_exit_code ?? 'unknown'}`,
            '',
            'Policy: fail on high or critical vulnerabilities in any dependency scope; lower severities remain visible in evidence.',
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          console.log(markdown);

          const severe = allCounts.high + allCounts.critical;
          if (severe > 0) {
            console.error(`Security gate failed: ${allCounts.high} high and ${allCounts.critical} critical vulnerabilities.`);
            process.exit(1);
          }
          console.log('Security gate passed: no high or critical npm vulnerabilities.');
          NODE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit-${{ github.run_id }}
          path: |
            npm-audit-all.json
            npm-audit-production.json
            npm-audit-summary.json
          if-no-files-found: ignore
          retention-days: 14
