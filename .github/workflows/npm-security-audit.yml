name: NPM dependency security audit

on:
  push:
    branches:
      - "audit/npm-dependency-security-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate current lockfile install
        run: npm ci --ignore-scripts

      - name: Capture vulnerable dependency paths
        shell: bash
        run: |
          npm ls postcss nanoid --all --json > npm-dependency-paths-before.json || true

      - name: Update vulnerable transitive packages within declared ranges
        run: npm update postcss nanoid --package-lock-only --ignore-scripts

      - name: Validate remediated lockfile install
        run: npm ci --ignore-scripts

      - name: Capture remediated dependency paths
        shell: bash
        run: |
          npm ls postcss nanoid --all --json > npm-dependency-paths-after.json || true

      - name: Audit all dependencies
        id: audit_all
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit production dependencies
        id: audit_prod
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize audit
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function readReport(path) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (report.error) throw new Error(`${path}: ${JSON.stringify(report.error)}`);
            return report;
          }

          function counts(report) {
            const value = report.metadata?.vulnerabilities ?? {};
            return {
              info: Number(value.info ?? 0),
              low: Number(value.low ?? 0),
              moderate: Number(value.moderate ?? 0),
              high: Number(value.high ?? 0),
              critical: Number(value.critical ?? 0),
              total: Number(value.total ?? 0),
            };
          }

          const allCounts = counts(readReport('npm-audit-all.json'));
          const productionCounts = counts(readReport('npm-audit-production.json'));
          const summary = { all: allCounts, production: productionCounts };
          fs.writeFileSync('npm-audit-summary.json', JSON.stringify(summary, null, 2) + '\n');

          const markdown = [
            '# npm dependency security remediation',
            '',
            '| Scope | Info | Low | Moderate | High | Critical | Total |',
            '| --- | ---: | ---: | ---: | ---: | ---: | ---: |',
            `| All dependencies | ${allCounts.info} | ${allCounts.low} | ${allCounts.moderate} | ${allCounts.high} | ${allCounts.critical} | ${allCounts.total} |`,
            `| Production only | ${productionCounts.info} | ${productionCounts.low} | ${productionCounts.moderate} | ${productionCounts.high} | ${productionCounts.critical} | ${productionCounts.total} |`,
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          console.log(markdown);
          NODE

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-remediation-${{ github.run_id }}
          path: |
            package-lock.json
            npm-dependency-paths-before.json
            npm-dependency-paths-after.json
            npm-audit-all.json
            npm-audit-production.json
            npm-audit-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce clean audit
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summary = JSON.parse(fs.readFileSync('npm-audit-summary.json', 'utf8'));
          if (summary.all.total !== 0 || summary.production.total !== 0) {
            console.error(`Audit still reports vulnerabilities: ${JSON.stringify(summary)}`);
            process.exit(1);
          }
          console.log('Security remediation verified: npm audit reports zero vulnerabilities.');
          NODE
