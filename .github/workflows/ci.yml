name: Keynu validation

on:
  push:
    branches:
      - main
      - "audit/**"
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and dashboard
        run: npm run build

      - name: Run all compiled tests
        run: node scripts/run-all-tests.mjs
